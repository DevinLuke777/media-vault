services:
  media-vault:
    build: .
    container_name: media-vault
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./media-vault-data:/data          # SQLite 数据库持久化
      - /path/to/your/media:/media:ro     # ⚠️ 改成你的媒体目录（平台/日期/标题结构）
    environment:
      - MEDIA_ROOT=/media
      - DB_PATH=/data/media_library.db
